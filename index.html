<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repository Dispatch Trigger</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .container { max-width: 500px; margin: auto; }
        input, button { display: block; width: 100%; margin-bottom: 10px; padding: 10px; box-sizing: border-box; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        #status { margin-top: 20px; padding: 10px; border-radius: 4px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Trigger Workflow</h1>
        
        <label for="pat">GitHub Personal Access Token (PAT):</label>
        <input type="password" id="pat" placeholder="ghp_xxxxxxxxxxxx">
        <div style="margin-bottom: 10px; font-size: 0.8em; color: #666;">
            <input type="checkbox" id="save-pat" style="display: inline; width: auto; margin: 0 5px 0 0;">
            <label for="save-pat" style="display: inline; font-weight: normal;">Remember token in this browser</label>
        </div>
        
        <label for="data">Payload Data:</label>
        <input type="text" id="data" placeholder="Enter data here...">
        
        <button id="start">Start</button>
        
        <div id="status"></div>
    </div>

    <script>
        const startBtn = document.getElementById('start');
        const patInput = document.getElementById('pat');
        const savePatCheckbox = document.getElementById('save-pat');
        const dataInput = document.getElementById('data');
        const statusDiv = document.getElementById('status');

        const OWNER = 'dominicmoser-sage';
        const REPO = 'testPages';
        const STORAGE_KEY = 'github_pat';

        // Load saved PAT on startup
        window.addEventListener('DOMContentLoaded', () => {
            const savedPat = localStorage.getItem(STORAGE_KEY);
            if (savedPat) {
                patInput.value = savedPat;
                savePatCheckbox.checked = true;
            }
        });

        startBtn.addEventListener('click', async () => {
            const pat = patInput.value.trim();
            const data = dataInput.value.trim();
            
            if (!pat) {
                showStatus('Please enter a GitHub PAT', 'error');
                return;
            }

            showStatus('Sending request...', '');

            try {
                const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/vnd.github+json',
                        'Authorization': `Bearer ${pat}`,
                        'X-GitHub-Api-Version': '2022-11-28'
                    },
                    body: JSON.stringify({
                        event_type: 'my-event',
                        client_payload: {
                            data: data
                        }
                    })
                });

                if (response.ok) {
                    showStatus('Success! repository_dispatch event triggered.', 'success');
                    
                    // Save or clear PAT based on checkbox
                    if (savePatCheckbox.checked) {
                        localStorage.setItem(STORAGE_KEY, pat);
                    } else {
                        localStorage.removeItem(STORAGE_KEY);
                    }
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    showStatus(`Error: ${response.status} ${response.statusText}. ${errorData.message || ''}`, 'error');
                }
            } catch (error) {
                showStatus(`Network Error: ${error.message}`, 'error');
            }
        });

        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = type;
        }
    </script>
</body>
</html>
