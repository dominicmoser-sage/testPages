name: Encrypt Hello World

on:
  workflow_dispatch:

permissions: {}

jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt text
        id: encrypt
        env:
          ENCRYPTION_KEY: ${{ secrets.KEY }}
        shell: bash
        run: |
          if [[ -z "$ENCRYPTION_KEY" ]]; then
            echo "::error::Set a repository secret named KEY."
            exit 1
          fi

          ciphertext="$(node <<'NODE'
          const { createHash, createCipheriv, randomBytes } = require("node:crypto");

          const key = createHash("sha256")
            .update(process.env.ENCRYPTION_KEY, "utf8")
            .digest();

          const iv = randomBytes(12);
          const cipher = createCipheriv("aes-256-gcm", key, iv);
          const encrypted = Buffer.concat([
            cipher.update("Hello World", "utf8"),
            cipher.final(),
          ]);

          // Base64 encodes the IV, authentication tag, and ciphertext together.
          console.log(Buffer.concat([iv, cipher.getAuthTag(), encrypted]).toString("base64"));
          NODE
          )"

          echo "ciphertext=$ciphertext" >> "$GITHUB_OUTPUT"

      - name: Show ciphertext
        env:
          CIPHERTEXT: ${{ steps.encrypt.outputs.ciphertext }}
        run: printf 'Ciphertext (base64): %s\n' "$CIPHERTEXT"
