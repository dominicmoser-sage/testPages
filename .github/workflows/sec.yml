name: Encrypt Hello World

on:
  workflow_dispatch:

permissions: {}

jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - name: Install age
        run: |
          sudo apt-get update
          sudo apt-get install -y age

      - name: Encrypt text
        id: encrypt
        env:
          AGE_RECIPIENT: ${{ secrets.KEY }}
          VALUE: ${{ secrets.TEST }}
        shell: bash
        run: |
          if [[ ! "$AGE_RECIPIENT" =~ ^age1[0-9a-z]+$ ]]; then
            echo "::error::Set the repository secret KEY to the age public recipient key (age1...)."
            exit 1
          fi

          ciphertext="$(
            printf '%s' '$VALUE' |
              age --encrypt --recipient "$AGE_RECIPIENT" |
              base64 -w0
          )"

          echo "ciphertext=$ciphertext" >> "$GITHUB_OUTPUT"

      - name: Show ciphertext
        env:
          CIPHERTEXT: ${{ steps.encrypt.outputs.ciphertext }}
        run: |
          printf 'Encrypted output (base64): %s\n' "$CIPHERTEXT"
