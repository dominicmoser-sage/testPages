name: Encrypt Hello World

on:
  workflow_dispatch:

permissions: {}

jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - name: Install age
        env:
          AGE_VERSION: v1.2.1
          shell: bash
        run: |
          set -euo pipefail

          curl --fail --location \
            "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION#v}-linux-amd64.tar.gz" \
            --output /tmp/age.tar.gz
          
          sudo tar -xzf /tmp/age.tar.gz \
            --strip-components=1 \
            -C /usr/local/bin \
            age/age age/age-keygen

          age --version

      - name: Encrypt text
        id: encrypt
        env:
          AGE_RECIPIENT: ${{ secrets.KEY }}
          VALUE: ${{ secrets.TEST }}
        shell: bash
        run: |
          if [[ ! "$AGE_RECIPIENT" =~ ^age1[0-9a-z]+$ ]]; then
            echo "::error::Set the repository secret KEY to the age public recipient key (age1...)."
            exit 1
          fi

          ciphertext="$(
            printf '%s' '$VALUE' |
              age --encrypt --recipient "$AGE_RECIPIENT" |
              base64 -w0
          )"

          echo "ciphertext=$ciphertext" >> "$GITHUB_OUTPUT"

      - name: Show ciphertext
        env:
          CIPHERTEXT: ${{ steps.encrypt.outputs.ciphertext }}
        run: |
          printf 'Encrypted output (base64): %s\n' "$CIPHERTEXT"
